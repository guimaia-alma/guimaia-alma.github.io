name: Publicar Caderno
on:
  push:
    branches: [main]
  schedule:
    # horários em UTC (Brasília = UTC-3): 07:35, 09:35, 17:35 e 18:05
    - cron: "35 10 * * *"
    - cron: "35 12 * * *"
    - cron: "35 20 * * *"
    - cron: "5 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
